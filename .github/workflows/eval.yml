name: Eval

on:
  pull_request:
    paths:
      - "evals/**"
      - "prompts/**"
      - "services/workers/civic_scraper/extraction/**"
      - "services/workers/civic_scraper/llm.py"
      - "services/workers/civic_scraper/models.py"

permissions:
  contents: read

jobs:
  eval:
    name: Run extraction eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - run: uv sync --locked

      # Keyed on gold-set and prompt content, not just branch/commit, so a
      # cache hit means "this exact input was already scored" regardless of
      # what else changed. A hit makes the eval run free (llm.py checks the
      # cache before ever constructing an Anthropic client) - this exists
      # specifically so routine CI runs don't silently re-bill on every push.
      - name: Cache LLM responses
        uses: actions/cache@v4
        with:
          path: .cache/llm
          key: llm-cache-${{ hashFiles('evals/gold/**', 'prompts/**') }}

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set - skipping the eval run."
            echo "This is a no-op, not a failure: nothing here should force"
            echo "API spend on every push without an explicit opt-in secret."
            exit 0
          fi
          uv run python evals/run_eval.py

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/latest.json
          if-no-files-found: ignore

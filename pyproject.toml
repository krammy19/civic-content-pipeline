[project]
name = "civic-engagement-app"
version = "0.1.0"
description = "Ingests municipal government meeting documents from heterogeneous city platforms, extracts structured facts with an LLM, validates the output, and publishes digests that pass automated quality gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.103.1",
    "beautifulsoup4>=4.14.3",
    "pdfplumber>=0.11.9",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "selenium>=4.43.0",
]

[project.scripts]
civic = "civic_scraper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# civic_scraper lives under services/workers/, not at the repo root or
# under src/ - this tells hatchling where the actual importable package
# is so `civic_scraper` (not `services`) ends up as the top-level module
# name in the built wheel, which is what makes `[project.scripts]` above
# resolvable at all.
[tool.hatch.build.targets.wheel]
packages = ["services/workers/civic_scraper"]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "venv", ".venv", "notebooks", "temp_files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# One-time gold-set generator embedding verbatim real-document text -
# wrapping every string to 100 chars would fragment the quoted source
# rather than improve readability.
"scripts/build_gold_set.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/workers", "."]
